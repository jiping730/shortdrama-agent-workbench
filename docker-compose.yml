services:
  platform:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://platform:platform@postgres:5432/platform
      ARTIFACT_DIR: /app/data/artifacts
    volumes:
      - platform_data:/app/data
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  platform_data:
  postgres_data:
